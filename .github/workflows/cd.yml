name: CD for 9router

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false

  deploy-to-vps:
    needs: build-and-push-images
    runs-on: ubuntu-latest

    steps:
      - name: Deploy 9router to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Login to GitHub Container Registry on the VPS
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the latest 9router image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Stop and remove existing container if it exists
            docker stop 9router || true
            docker rm 9router || true

            # Start the new container
            docker run -d \
              --name 9router \
              --restart unless-stopped \
              -p 127.0.0.1:20128:20128 \
              -v 9router_data:/app/data \
              -v 9router_home:/home/node \
              -v 9router_root:/root \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Cleanup old dangling images
            docker image prune -a -f

            # Configure NGINX for the subdomain using secrets
            cat > /etc/nginx/sites-available/${{ secrets.PROXY_DOMAIN }} << 'EOF'
            server {
                listen 80;
                server_name ${{ secrets.PROXY_DOMAIN }};
                
                location / {
                    proxy_pass http://127.0.0.1:20128;
                    proxy_http_version 1.1;
                    proxy_set_header Host              $host;
                    proxy_set_header X-Real-IP         $remote_addr;
                    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 60s;
                }
                
                server_tokens off;
            }
            EOF

            # Enable the site and restart NGINX
            ln -sf /etc/nginx/sites-available/${{ secrets.PROXY_DOMAIN }} /etc/nginx/sites-enabled/${{ secrets.PROXY_DOMAIN }}
            systemctl reload nginx
